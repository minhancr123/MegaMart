# CI: chạy trên mọi PR và push lên main.
# Triết lý: bước nào ĐỎ là chặn merge. Test/lint đang nợ kỹ thuật nên để
# report-only (continue-on-error) + TODO, KHÔNG cho đỏ cả pipeline.
# TODO(devops-2): fix 12 jest suites fail + eslint strict rồi bật blocking.

name: CI

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-validate:
    name: Server typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck (blocking)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests (report-only, đang nợ fix mock)
        continue-on-error: true
        run: npm test -- --passWithNoTests

  client-validate:
    name: Client typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Typecheck (blocking)
        run: npx tsc --noEmit -p tsconfig.json

  docker-build:
    name: Docker build dry-run (blocking)
    runs-on: ubuntu-latest
    needs: [server-validate, client-validate]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build server image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: false
          tags: megamart-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build client image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: false
          tags: megamart-client:ci
          # NEXT_PUBLIC_* bake vào bundle lúc build — CI dùng URL giả để test build.
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3001
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build nginx image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          push: false
          tags: megamart-nginx:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
