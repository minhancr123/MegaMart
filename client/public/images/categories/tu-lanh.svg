<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Refrigerator Body -->
  <rect x="22" y="10" width="36" height="60" rx="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  <!-- Top Door (Freezer) -->
  <rect x="23" y="11" width="34" height="22" rx="3" fill="#F1F5F9"/>
  <!-- Handle top -->
  <rect x="25" y="22" width="3" height="8" rx="1.5" fill="#64748B"/>
  <!-- Divider -->
  <line x1="22" y1="34" x2="58" y2="34" stroke="#94A3B8" stroke-width="2"/>
  <!-- Bottom Door -->
  <rect x="23" y="35" width="34" height="34" rx="2" fill="#FFFFFF"/>
  <!-- Handle bottom -->
  <rect x="25" y="38" width="3" height="12" rx="1.5" fill="#64748B"/>
  <!-- Water dispenser display -->
  <rect x="42" y="40" width="10" height="12" rx="2" fill="#E2E8F0"/>
  <rect x="45" y="47" width="4" height="3" rx="1" fill="#38BDF8"/>
</svg>
