# MegaMart reverse proxy: hứng 80/443, chia traffic cho client (/) và API (/api).
# Port 80 chỉ để phục vụ ACME challenge của certbot rồi redirect sang HTTPS.

upstream megamart_server {
    server server:3001 max_fails=3 fail_timeout=30s;
}

upstream megamart_client {
    server client:3000 max_fails=3 fail_timeout=30s;
}

# API trả JSON 48KB chưa nén; nén ở tầng proxy giúp lần tải đầu nhẹ đi nhiều.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    application/json
    application/javascript
    text/css
    text/javascript
    text/plain
    text/xml
    application/xml
    image/svg+xml;

# ---- HTTPS: cert Let's Encrypt cho megamart24.tech (cấu hình 2026-09-28) ----
server {
    listen 80;
    server_name megamart24.tech;

    # ACME HTTP-01 vẫn phải đi qua http:// để certbot gia hạn được.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # Trả về HTTPS trong <1s thay vì để trình duyệt tự nhảy (SEO + tránh lệch origin).
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name megamart24.tech;

    ssl_certificate /etc/letsencrypt/live/megamart24.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/megamart24.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25M;

    # Ảnh sản phẩm nằm trong R2 bucket megamart-images, đi qua r2.dev.
    # Dùng regex giới hạn theo đuôi file vì Next.js cũng phục vụ route
    # /products/<slug> cho trang chi tiết — proxy cả /products/ sẽ khiến
    # trang chi tiết bị đẩy sang R2 và trả 404.
    # Ảnh sản phẩm nằm trong R2 bucket megamart-images. Match theo đuôi file
    # vì Next.js cũng phục vụ /products/<slug> cho trang chi tiết — match theo
    # prefix sẽ khiến trang đó bị đẩy sang R2 và trả 404.
    #
    # proxy_pass không kèm URI giữ nguyên đường dẫn gốc (/products/...),
    # khớp đúng khoá object trong bucket. KHÔNG dùng rewrite ở đây: nginx cấm
    # URI trong proxy_pass của location dạng regex, mà rewrite sẽ cắt mất
    # tiền tố products/ khoá object cần.
    location ~ ^/products/.+\.(?:webp|jpe?g|png|avif|gif|svg)$ {
        proxy_pass https://pub-58644278e2a84a899139a6c26f6cd6bd.r2.dev;
        proxy_http_version 1.1;
        proxy_set_header Host pub-58644278e2a84a899139a6c26f6cd6bd.r2.dev;
        proxy_ssl_server_name on;
        # EC2 chỉ có IPv4, R2 có cả bản ghi AAAA. Buộc IPv4 để tránh
        # "connect() to [2606:4700...]:443 failed (Network unreachable)".
        resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;

        # Tên ảnh bất biến theo phiên bản, cache aggressive 30 ngày.
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Served-By "r2" always;
    }

    # API (NestJS, global prefix /api) — timeout dài hơn vì webhook SePay giữ
    # request mở trong lúc xử lý bất đồng bộ.
    location /api {
        proxy_pass http://megamart_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Frontend (Next.js standalone) — cần Upgrade header cho HMR/dev, giữ cho prod.
    location / {
        proxy_pass http://megamart_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
