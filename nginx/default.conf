# MegaMart reverse proxy: hứng 80/443, chia traffic cho client (/) và API (/api).
# Quy trình HTTPS 2 bước (chi tiết trong DEPLOY.md):
#   B1: chạy với file này (chỉ HTTP) -> certbot xin cert.
#   B2: bật server 443 bên dưới (bỏ comment) -> reload nginx.

upstream megamart_server {
    server server:3001 max_fails=3 fail_timeout=30s;
}

upstream megamart_client {
    server client:3000 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    # Certbot HTTP-01 challenge — giữ nguyên để xin/gia hạn SSL.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Backend API (NestJS, global prefix /api)
    location /api {
        proxy_pass http://megamart_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Frontend (Next.js standalone)
    location / {
        proxy_pass http://megamart_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

